
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erfolgreich angemeldet</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #202124;
        }

        .box {
            width: 450px;
            min-height: 430px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 45px 40px;
            text-align: center;
        }

        .logo {
            font-size: 34px;
            font-weight: 500;
            margin-bottom: 35px;
            letter-spacing: -2px;
        }

        .blue { color: #4285f4; }
        .red { color: #ea4335; }
        .yellow { color: #fbbc05; }
        .green { color: #34a853; }

        .check {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            background: #34a853;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 15px;
        }

        p {
            color: #5f6368;
            font-size: 16px;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            margin-top: 35px;
            padding: 11px 25px;
            background: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
        }

        .button:hover {
            background: #1765c1;
        }

        @media (max-width: 500px) {
            .box {
                width: 100%;
                min-height: 100vh;
                border: none;
                padding: 40px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>

        <div class="check">✓</div>

        <h1>Erfolgreich angemeldet!</h1>

        <p>
            Du wurdest erfolgreich angemeldet.
            <br>
            Du kannst diese Seite nun schließen.
        </p>

    </div>

</body>
</html>
